# Database
spring.datasource.url=jdbc:mysql://localhost:3316/spring-modulith-kotlin?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=pw
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Monitoring
management.endpoints.web.exposure.include=*
management.tracing.enabled=true
management.otlp.tracing.endpoint=http://127.0.0.1:4318/v1/traces
management.otlp.tracing.transport=http
# Datasource Proxy (show sql log)
logging.level.net.ttddyy.dsproxy.listener=debug
