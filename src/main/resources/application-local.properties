# Database
spring.datasource.url=jdbc:mysql://localhost:3326/spring-modulith-kotlin?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=pw
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Monitoring
management.endpoints.web.exposure.include=*
management.tracing.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=http://127.0.0.1:4318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http
# Datasource Micrometer (show sql log)
jdbc.datasource-proxy.query.enable-logging=true
logging.level.net.ttddyy.dsproxy.listener=debug
# Fruit ordering UI basic auth (local only)
fruit-ordering.basic-auth.username=fruit
fruit-ordering.basic-auth.password=fruit-local
