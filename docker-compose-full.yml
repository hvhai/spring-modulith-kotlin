services:
  backend:
    image: modulith-project:latest
    platform: linux/amd64
    build:
      dockerfile: ./Dockerfile
    ports:
      - 8080:8088
    environment:
      - SERVER_PORT=8088
      - APP_H2_PASS=1
      - APP_METHOD_API_TOKEN=${APP_METHOD_API_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - DOMAIN=${DOMAIN}
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - MANAGEMENT_TRACING_ENABLED=true
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      - MANAGEMENT_OTLP_TRACING_TRANSPORT=http
      - LOKI_URL=http://loki:3100
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 512M
        reservations:
          cpus: 0.5
          memory: 256M
    depends_on:
      - tempo
      - loki
    networks:
      - spring-modulith-kotlin-network

  loki:
    image: grafana/loki:3.7.7
    platform: linux/amd64
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    networks:
      - spring-modulith-kotlin-network

  tempo:
    image: grafana/tempo:3.0.3
    platform: linux/amd64
    command: [ "-target=all", "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # tempo API/UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - spring-modulith-kotlin-network

  prometheus:
    image: prom/prometheus:v3.14.0
    platform: linux/amd64
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - spring-modulith-kotlin-network

  grafana:
    image: grafana/grafana:13.2.1
    platform: linux/amd64
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./docker/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - spring-modulith-kotlin-network
networks:
  spring-modulith-kotlin-network: